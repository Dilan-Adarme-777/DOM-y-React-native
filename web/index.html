<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Interactividad con el DOM</title>
<link rel="stylesheet" href="./css/styles.css">
<script type="module" src="./js/app.js"></script>
</head>
<body>

    <div class="contenedor">
    <h1>Interactividad con el DOM</h1>
    <p>Haz clic en el botón para incrementar el contador y registrar la hora exacta del evento en la tabla.</p>

    <div id="contador" class="contador">0</div>

    <button id="btnClic" class="btn-clic">¡Haz Clic Aquí!</button>

    <div class="tabla-contenedor">
        <table>
        <thead>
            <tr>
            <th>Nº Clic</th>
            <th>Hora</th>
            </tr>
        </thead>
        <tbody id="tablaRegistros">
        </tbody>
        </table>
    </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
